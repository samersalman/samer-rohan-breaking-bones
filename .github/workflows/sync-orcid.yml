name: Sync ORCID papers

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ORCID works and enrich from Crossref and PubMed
        run: python3 -I scripts/sync_orcid.py
      - name: Open a pull request if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/orcid-sync
          commit-message: "Sync papers from ORCID"
          title: "New or updated papers from ORCID"
          body: |
            Automated weekly sync. New papers are added as drafts with `reviewed: false`
            and "Summary coming." Please write or approve the plain-English fields in
            `data/papers.json` before merging. See `data/README.md`.
          add-paths: |
            data/papers.json
            data/archive.json
          delete-branch: true
